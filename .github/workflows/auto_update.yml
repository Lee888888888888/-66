name: Auto Update and Clean Nodes

on:
  # 1. 设置定时任务：每隔 6 小时自动运行一次 (UTC 时间，可按需调整)
  schedule:
    - cron: '0 */6 * * *'
  
  # 2. 允许你随时在网页上手动点击按钮触发运行
  workflow_dispatch:

jobs:
  update-nodes:
    runs-on: ubuntu-latest
    steps:
      - name: 检查仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 运行清洗脚本
        run: python clean.py

      - name: 自动提交并推送更新到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ipv4_cleaned.txt
          # 如果文件有改动才提交，防止无意义的空提交
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto update cleaned nodes" && git push)
