name: Auto Update and Clean Nodes

on:
  schedule:
    - cron: '0 6 * * *'    # UTC 06:00 → BJ时间14:00（下午2点）
    - cron: '0 14 * * *'   # UTC 14:00 →   时间22:00（晚上10点）
    - cron: '0 20 * * *'   # UTC 20:00 →   时间04:00（凌晨4点）

  workflow_dispatch:

jobs:
  update-nodes:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: 检查仓库代码
        uses: actions/checkout@v4   # 确保这里是 v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5   # 确保这里是 v5
        with:
          python-version: '3.10'

      - name: 运行清洗脚本
        run: python clean.py

      - name: 自动提交并推送更新到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ipv4_cleaned.txt
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto update cleaned nodes" && git push)
